name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: guaro-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            exec 9>/tmp/guaro-production-deploy.lock
            flock -w 1800 9
            app_dir=""
            for candidate in /opt/guaro /root/Guaro /root/guaro /root/Guaro-1 /home/ubuntu/Guaro /home/ubuntu/guaro; do
              if [ -d "$candidate/.git" ] && [ -f "$candidate/docker-compose.prod.yml" ]; then
                app_dir="$candidate"
                break
              fi
            done
            if [ -z "$app_dir" ]; then
              compose_file="$(find /opt /root /home -maxdepth 5 -type f -name docker-compose.prod.yml -print -quit 2>/dev/null || true)"
              app_dir="${compose_file%/docker-compose.prod.yml}"
            fi
            test -n "$app_dir"
            test -d "$app_dir/.git"
            cd "$app_dir"
            umask 077
            mkdir -p backups
            backup_file="backups/pre-deploy-$(date +%Y%m%d-%H%M%S).dump"
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T guaro-db \
              sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" -Fc' > "$backup_file"
            test -s "$backup_file"
            git pull origin main
            docker compose -f docker-compose.prod.yml --env-file .env.prod build
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            backend_ready=false
            for attempt in $(seq 1 24); do
              if docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend \
                node -e "fetch('http://127.0.0.1:3000/auth/me').then(r => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))"; then
                backend_ready=true
                break
              fi
              sleep 5
            done
            if [ "$backend_ready" != "true" ]; then
              docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=120 backend
              exit 1
            fi
            docker compose -f docker-compose.prod.yml ps
