x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  guaro-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  guaro-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@guaro-db:5432/${POSTGRES_DB}
      REDIS_HOST: guaro-redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY}
      FILE_INTEGRATIONS_REMOTE_WRITE_ENABLED: ${FILE_INTEGRATIONS_REMOTE_WRITE_ENABLED:-false}
      FILE_INTEGRATIONS_STORE_ARTIFACTS: ${FILE_INTEGRATIONS_STORE_ARTIFACTS:-false}
      UPC_ACTIVITY_PRICE_REMOTE_WRITE_ENABLED: ${UPC_ACTIVITY_PRICE_REMOTE_WRITE_ENABLED:-false}
      UPC_ACTIVITY_PRICE_LIVE_SHOP_ALLOWLIST: ${UPC_ACTIVITY_PRICE_LIVE_SHOP_ALLOWLIST:-}
      AUTO_OPEN_REMOTE_WRITE_ENABLED: ${AUTO_OPEN_REMOTE_WRITE_ENABLED:-false}
      DIDI_STORE_BINDINGS_ENABLED: ${DIDI_STORE_BINDINGS_ENABLED:-true}
      DIDI_STORE_BINDINGS_TEST_APP_IDS: ${DIDI_STORE_BINDINGS_TEST_APP_IDS:-5764607654490537991}
      DIDI_STORE_BINDINGS_PRODUCTION_BIND_ENABLED: ${DIDI_STORE_BINDINGS_PRODUCTION_BIND_ENABLED:-true}
      DIDI_STORE_BINDINGS_PRODUCTION_UNBIND_ENABLED: ${DIDI_STORE_BINDINGS_PRODUCTION_UNBIND_ENABLED:-true}
      DIDI_STORE_BINDINGS_TIMEOUT_MS: ${DIDI_STORE_BINDINGS_TIMEOUT_MS:-30000}
      DIDI_STORE_BINDINGS_PAGE_CACHE_TTL_MS: ${DIDI_STORE_BINDINGS_PAGE_CACHE_TTL_MS:-60000}
      DIDI_STORE_BINDINGS_PAGE_CACHE_MAX_ENTRIES: ${DIDI_STORE_BINDINGS_PAGE_CACHE_MAX_ENTRIES:-250}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
      DCHAT_URL: ${DCHAT_URL:-}
      DCHAT_GROUP_ID: ${DCHAT_GROUP_ID:-}
      DCHAT_STORE_CLOSURE_GROUP_ID: ${DCHAT_STORE_CLOSURE_GROUP_ID:-}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      NODE_ENV: production
    networks:
      - internal
      - grocerytools_webnet
    depends_on:
      guaro-db:
        condition: service_healthy
      guaro-redis:
        condition: service_healthy
    logging: *default-logging

  neto-worker:
    image: guaro-backend:latest
    command: ['node', 'tiendas-neto/supervisor.cjs']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "const fs=require('fs');const s=JSON.parse(fs.readFileSync('/app/uploads/tiendas-neto/supervisor-status.json'));const fresh=Date.now()-Date.parse(s.updatedAt)<30000;process.exit(fresh&&s.enabled===true&&s.running===true&&s.runnerResponsive===true?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 120s
    cpus: '0.50'
    mem_limit: 512m
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@guaro-db:5432/${POSTGRES_DB}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY}
      DIDI_NETO_DATA_ROOT: /app/uploads/tiendas-neto
      NODE_ENV: production
    networks:
      - internal
    depends_on:
      guaro-db:
        condition: service_healthy
    logging: *default-logging

  promo-manager:
    build:
      context: .
      dockerfile: promo-manager/Dockerfile
    image: guaro-promo-manager:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@guaro-db:5432/${POSTGRES_DB}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY}
      PROMO_API_URL: https://openapi.didi-food.com/v1/promo/promo/uploadGrocery
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - promo_manager_output:/app/promo-manager/output
    networks:
      - internal
    depends_on:
      guaro-db:
        condition: service_healthy
    mem_limit: 640m
    cpus: '0.75'
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_URL}/api
    restart: unless-stopped
    networks:
      - internal
      - grocerytools_webnet
    depends_on:
      - backend
      - promo-manager
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  promo_manager_output:

networks:
  internal:
    driver: bridge
  grocerytools_webnet:
    external: true
